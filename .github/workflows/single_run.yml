name: Single Run
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install summary dependencies
      run: pip install openai pycryptodome pillow ImageHash requests
    - name: Fetch database from data branch
      run: |
        mkdir -p data
        # Force-fetch (+refspec) so non-fast-forward updates from
        # force-pushed data branches are picked up (shallow clone
        # otherwise refuses to overwrite the stale tracking ref).
        git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data" 2>/dev/null \
          || { echo "No data branch, starting fresh."; exit 0; }
        # Use ls-tree (reads tree directly) instead of cat-file
        # (requires fetched blobs) in case the shallow clone hasn't
        # fetched every blob object yet.
        git ls-tree origin/data --name-only data/ | grep -q . \
          || { echo "No database found on data branch, starting fresh."; exit 0; }
        # Determine format from tree listing (ls-tree reads tree
        # objects directly without needing the blobs fetched).
        files=$(git ls-tree origin/data --name-only data/ | tr '\n' ' ')
        echo "Data branch files: $files"
        if echo "$files" | grep -q "icourse-index.enc"; then
          mkdir -p data/sharded/shards
          git show origin/data:data/icourse-index.enc > data/sharded/icourse-index.enc
          shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
          for path in $shard_paths; do
            base=$(basename "$path")
            git show "origin/data:$path" > "data/sharded/shards/$base"
          done
          echo "Loaded $(ls data/sharded/shards 2>/dev/null | wc -l) shard(s)."
        elif echo "$files" | grep -q "icourse.db.gz.enc"; then
          git show origin/data:data/icourse.db.gz.enc > data/icourse.db.gz.enc
          echo "Loaded legacy compressed database."
        elif echo "$files" | grep -q "icourse.db.enc"; then
          git show origin/data:data/icourse.db.enc > data/icourse.db.enc
          echo "Loaded legacy uncompressed database."
        else
          echo "No database found on data branch, starting fresh."
        fi
    - name: Decode database
      if: hashFiles('data/sharded/icourse-index.enc', 'data/icourse.db.gz.enc', 'data/icourse.db.enc') != ''
      env:
        STUID: ${{ secrets.STUID }}
        UISPSW: ${{ secrets.UISPSW }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: |
        if [ -f data/sharded/icourse-index.enc ]; then
          # Sharded format — always v2.
          python scripts/db_shard.py reassemble data/sharded data/icourse.db
          echo "Reassembled sharded database."
          exit 0
        fi

        # Legacy single-file path (one-time migration on first sharded run).
        NEW_KEY=$(printf '%s' "ICSv2:${STUID}:${UISPSW}" | sha256sum | cut -d' ' -f1)
        LEGACY_KEY="${STUID}${UISPSW}${DASHSCOPE_API_KEY}${SMTP_PASSWORD}"

        decrypt_blob() {
          local in_path="$1"
          local out_path="$2"
          if openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
               -in "$in_path" -out "$out_path" \
               -pass pass:"$NEW_KEY" 2>/dev/null; then
            echo "v2"
            return 0
          fi
          if openssl enc -aes-256-cbc -d -pbkdf2 \
               -in "$in_path" -out "$out_path" \
               -pass pass:"$LEGACY_KEY" 2>/dev/null; then
            echo "legacy"
            return 0
          fi
          return 1
        }

        if [ -f data/icourse.db.gz.enc ]; then
          if VER=$(decrypt_blob data/icourse.db.gz.enc data/icourse.db.gz); then
            gzip -d data/icourse.db.gz
            echo "Legacy compressed DB decrypted ($VER)."
          else
            echo "::warning::Decryption failed (both keys). Starting with fresh database."
            rm -f data/icourse.db data/icourse.db.gz
          fi
        elif [ -f data/icourse.db.enc ]; then
          if VER=$(decrypt_blob data/icourse.db.enc data/icourse.db); then
            echo "Legacy uncompressed DB decrypted ($VER)."
          else
            echo "::warning::Decryption failed (both keys). Starting with fresh database."
            rm -f data/icourse.db
          fi
        fi
    - name: Regenerate cached course summaries
      env:
        REQUESTED_COURSE: ${{ inputs.course_ids }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
      run: |
        test "$REQUESTED_COURSE" = "39882"
        python -u .github/resummarize_39882.py generate
    - name: Deploy regenerated summaries
      if: always()
      env:
        STUID: ${{ secrets.STUID }}
        UISPSW: ${{ secrets.UISPSW }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ ! -f data/resummary-metrics.json ]; then
          echo "No regenerated summaries to deploy."
          exit 0
        fi
        git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data"
        EXPECTED_DATA_SHA=$(git rev-parse origin/data)
        git cat-file -e origin/data:data/icourse-index.enc
        mkdir -p data/remote_sharded/shards
        git show origin/data:data/icourse-index.enc > data/remote_sharded/icourse-index.enc
        while IFS= read -r path; do
          git show "origin/data:$path" > "data/remote_sharded/shards/$(basename "$path")"
        done < <(git ls-tree -r --name-only origin/data | grep '^data/shards/')
        python scripts/db_shard.py reassemble data/remote_sharded data/remote.db
        python .github/resummarize_39882.py merge
        python scripts/db_shard.py shard data/remote.db data/sharded_out
        mkdir -p /tmp/resummary_deploy/data/shards
        cp data/sharded_out/icourse-index.enc /tmp/resummary_deploy/data/
        cp data/sharded_out/shards/*.db.gz.enc /tmp/resummary_deploy/data/shards/
        cd /tmp/resummary_deploy
        git init -q
        git checkout -q -b data
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/
        git commit -q -m "Regenerate course 39882 study summaries at 1:4"
        git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        git push --force-with-lease="refs/heads/data:${EXPECTED_DATA_SHA}" origin data
'on':
  workflow_dispatch:
    inputs:
      course_ids:
        description: Course 39882 cached summary regeneration
        required: true
        type: string
      use_official_transcript:
        description: Retained for workflow compatibility
        required: false
        default: false
        type: boolean
run-name: Longer study summaries for course 39882
concurrency:
  group: resummarize-39882
  cancel-in-progress: false
